<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Resume AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  {% include "_loader.html" %}
  {% include "_header.html" %}

  <main id="main" class="auth-page">
    <div class="auth-container" style="grid-template-columns:1fr;max-width:420px">
      <div class="auth-card">
        <div class="auth-header">
          <a href="/" class="logo logo-center">
            <span class="logo-mark" aria-hidden="true"></span> Resume AI
          </a>
        </div>

        <h1 class="h3" style="text-align:center;margin:var(--space-2) 0">Set a new password</h1>
        <div class="auth-error" id="auth-error" role="alert" aria-live="polite"></div>

        <form class="auth-form" id="reset-form">
          <div class="field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" placeholder="Min. 14 characters" required autocomplete="new-password" minlength="14">
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" placeholder="••••••••••••••" required autocomplete="new-password" minlength="14">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Reset password</button>
        </form>

        <div id="reset-success" class="d-none" style="text-align:center;margin-top:var(--space-4)">
          <p style="color:var(--good);font-size:var(--text-sm)">Your password has been reset.</p>
          <a href="/login" class="btn btn-primary btn-block" style="margin-top:var(--space-3)">Sign in</a>
        </div>

        <div id="reset-no-token" class="d-none" style="text-align:center;margin-top:var(--space-4)">
          <p style="color:var(--warn);font-size:var(--text-sm)">This reset link is missing or invalid.</p>
          <a href="/login" class="btn btn-ghost btn-block" style="margin-top:var(--space-3)">Back to sign in</a>
        </div>
      </div>
    </div>
  </main>

  {% include "_footer.html" %}
  <script src="/static/js/main.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('reset-form');
    const errorEl = document.getElementById('auth-error');

    if (!token) {
      form.classList.add('d-none');
      document.getElementById('reset-no-token').classList.remove('d-none');
      return;
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.className = 'auth-error is-visible';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (pw !== confirm) { showError('Passwords do not match'); return; }
      if (pw.length < 8) { showError('Password must be at least 8 characters'); return; }

      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Resetting…';
      try {
        await Auth.resetPassword(token, pw);
        form.classList.add('d-none');
        document.getElementById('reset-success').classList.remove('d-none');
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Reset password';
      }
    });
  })();
  </script>
</body>
</html>
