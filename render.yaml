# Render Blueprint - deploy this repo to Render (free tier supported).
# Push to GitHub, then in Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: resume-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@resumeai.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
# NOTE: No databases: block here on purpose.
# Render allows only ONE active free-tier database per account, and you
# already have one (resume_ai_1abc). Creating 'resumeai-db' here is what
# caused: "cannot have more than one active free tier database".
# Set DATABASE_URL manually (see below) to your existing DB's connection string.
