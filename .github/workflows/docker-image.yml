name: CI — parallel builds

# Parallel jobs (tests, Docker build, Vercel preflight) run simultaneously,
# and a new push cancels the previous in-progress run so builds never queue.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        run: pytest tests/ -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag resume-ai:${{ github.sha }}

  deploy-preflight:
    name: Deploy preflight (Vercel config check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vercel.json
        run: python -c "import json; json.load(open('vercel.json')); print('vercel.json OK')"
      - name: Validate render.yaml
        run: python -c "import yaml" 2>/dev/null || pip install pyyaml -q; python -c "import yaml; yaml.safe_load(open('render.yaml')); print('render.yaml OK')"

